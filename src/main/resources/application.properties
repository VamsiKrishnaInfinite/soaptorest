spring.application.name=soapTorest
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/soaptorest
spring.data.mongodb.auto-index-creation=true

# API Documentation - Swagger/OpenAPI
# Use springdoc defaults for UI path (do not override to avoid resource mapping issues)
# springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.infinite.soaptorest=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null

# Use Jackson configuration programmatically if needed for Java 21 / Jackson 3 compatibility
spring.jackson.time-zone=UTC
